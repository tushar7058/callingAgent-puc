name: LiveKit Agent CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: livekit-agent-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: livekit-agent
  CONTAINER_NAME: livekit-agent
  DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/livekit-agent' }}

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          sudo -n docker build \
            --tag "${IMAGE_NAME}:${GITHUB_SHA}" \
            --tag "${IMAGE_NAME}:latest" \
            .

      - name: Deploy container
        env:
          PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PRODUCTION_ENV_FILE" ]; then
            echo "Missing required secret: PRODUCTION_ENV_FILE"
            exit 1
          fi

          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "Missing required secret: GOOGLE_SERVICE_ACCOUNT_JSON"
            exit 1
          fi

          umask 077
          env_tmp="$(mktemp)"
          key_tmp="$(mktemp)"
          printf '%s\n' "$PRODUCTION_ENV_FILE" > "$env_tmp"
          printf '%s\n' "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$key_tmp"

          sudo install -m 600 -o root -g root "$env_tmp" "$DEPLOY_DIR/.env"
          sudo install -m 400 -o 10001 -g 10001 "$key_tmp" "$DEPLOY_DIR/key.json"
          rm -f "$env_tmp" "$key_tmp"

          sudo -n docker rm -f "$CONTAINER_NAME" 2>/dev/null || true

          sudo -n docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            --env-file "$DEPLOY_DIR/.env" \
            --env GOOGLE_APPLICATION_CREDENTIALS=/app/key.json \
            --volume "$DEPLOY_DIR/key.json:/app/key.json:ro" \
            "${IMAGE_NAME}:${GITHUB_SHA}"

          sleep 5

          if [ "$(sudo -n docker inspect -f '{{.State.Running}}' "$CONTAINER_NAME")" != "true" ]; then
            echo "Container failed to start. Logs:"
            sudo -n docker logs --tail 200 "$CONTAINER_NAME" || true
            exit 1
          fi

          echo "Deployed: ${CONTAINER_NAME}"
          sudo -n docker ps --filter "name=${CONTAINER_NAME}"