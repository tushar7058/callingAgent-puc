name: LiveKit Agent CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: livekit-agent-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: livekit-agent
  CONTAINER_NAME: livekit-agent
  DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/livekit-agent' }}

jobs:
  ci-cd:
    name: Validate, Build, and Deploy
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Check formatting
        run: uv run ruff format --check src

      - name: Run lint
        run: uv run ruff check src

      - name: Run tests
        run: uv run pytest

      - name: Verify Docker engine
        run: docker info

      - name: Build Docker image
        run: |
          docker build \
            --pull \
            --tag "${IMAGE_NAME}:${GITHUB_SHA}" \
            --tag "${IMAGE_NAME}:latest" \
            .

      - name: Deploy container
        if: github.event_name != 'pull_request'
        env:
          PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PRODUCTION_ENV_FILE" ]; then
            echo "Missing required repository secret: PRODUCTION_ENV_FILE"
            exit 1
          fi

          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "Missing required repository secret: GOOGLE_SERVICE_ACCOUNT_JSON"
            exit 1
          fi

          sudo mkdir -p "$DEPLOY_DIR"
          sudo chown "$(id -u):$(id -g)" "$DEPLOY_DIR"
          sudo chown "$(id -u):$(id -g)" "$DEPLOY_DIR/key.json" 2>/dev/null || true

          umask 077
          printf '%s\n' "$PRODUCTION_ENV_FILE" > "$DEPLOY_DIR/.env"
          printf '%s\n' "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$DEPLOY_DIR/key.json"
          chmod 600 "$DEPLOY_DIR/.env"

          sudo chown 10001:10001 "$DEPLOY_DIR/key.json"
          sudo chmod 400 "$DEPLOY_DIR/key.json"

          docker rm -f "$CONTAINER_NAME" 2>/dev/null || true

          docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            --env-file "$DEPLOY_DIR/.env" \
            --volume "$DEPLOY_DIR/key.json:/app/key.json:ro" \
            "${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Show deployment status
        if: github.event_name != 'pull_request'
        run: docker ps --filter "name=${CONTAINER_NAME}"
